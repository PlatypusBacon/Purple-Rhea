<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Purple Rhea — 3D Scanner</title>
<style>
  :root {
    --bg: #0f1117;
    --surface: #1a1d27;
    --border: #2a2d3a;
    --text: #e1e4ed;
    --muted: #8b8fa3;
    --accent: #7c5cfc;
    --accent-hover: #6a48e6;
    --success: #34d399;
    --error: #f87171;
    --warning: #fbbf24;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', monospace;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }

  header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 16px 24px;
    border-bottom: 1px solid var(--border);
    background: var(--surface);
  }

  header h1 {
    font-size: 18px;
    font-weight: 600;
    letter-spacing: 1px;
  }

  header h1 span { color: var(--accent); }

  #connection-dot {
    width: 8px; height: 8px;
    border-radius: 50%;
    background: var(--error);
    display: inline-block;
    margin-right: 6px;
  }
  #connection-dot.connected { background: var(--success); }

  .container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 24px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 20px;
  }

  .card h2 {
    font-size: 13px;
    text-transform: uppercase;
    letter-spacing: 1.5px;
    color: var(--muted);
    margin-bottom: 16px;
  }

  .full-width { grid-column: 1 / -1; }

  /* Status card */
  #status-badge {
    display: inline-block;
    padding: 4px 12px;
    border-radius: 20px;
    font-size: 13px;
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 1px;
  }
  .badge-idle       { background: var(--border); color: var(--muted); }
  .badge-scanning   { background: #7c5cfc30; color: var(--accent); }
  .badge-processing { background: #fbbf2430; color: var(--warning); }
  .badge-done       { background: #34d39930; color: var(--success); }
  .badge-error      { background: #f8717130; color: var(--error); }

  .progress-bar {
    width: 100%;
    height: 6px;
    background: var(--border);
    border-radius: 3px;
    margin: 16px 0;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    background: var(--accent);
    border-radius: 3px;
    transition: width 0.3s ease;
    width: 0%;
  }

  #stage-text {
    font-size: 13px;
    color: var(--muted);
    min-height: 20px;
  }

  /* Controls */
  .btn-row { display: flex; gap: 10px; flex-wrap: wrap; }

  button {
    font-family: inherit;
    font-size: 13px;
    padding: 10px 20px;
    border: 1px solid var(--border);
    border-radius: 6px;
    background: var(--surface);
    color: var(--text);
    cursor: pointer;
    transition: all 0.15s;
  }

  button:hover {
    border-color: var(--accent);
    background: #7c5cfc15;
  }

  button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  button.primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  button.primary:hover { background: var(--accent-hover); }

  /* Log */
  #log {
    font-size: 12px;
    color: var(--muted);
    max-height: 200px;
    overflow-y: auto;
    white-space: pre-wrap;
    word-break: break-all;
  }

  #log .log-entry {
    padding: 2px 0;
    border-bottom: 1px solid #ffffff08;
  }

  /* Frames grid */
  .frame-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(120px, 1fr));
    gap: 8px;
    max-height: 400px;
    overflow-y: auto;
  }

  .frame-grid img {
    width: 100%;
    aspect-ratio: 4/3;
    object-fit: cover;
    border-radius: 6px;
    border: 1px solid var(--border);
    cursor: pointer;
    transition: transform 0.15s;
  }
  .frame-grid img:hover { transform: scale(1.05); }

  /* 3D viewer */
  #viewer-container {
    width: 100%;
    height: 400px;
    background: #0a0b10;
    border-radius: 8px;
    position: relative;
    overflow: hidden;
  }

  #viewer-container canvas {
    width: 100% !important;
    height: 100% !important;
  }

  .viewer-placeholder {
    display: flex;
    align-items: center;
    justify-content: center;
    height: 100%;
    color: var(--muted);
    font-size: 14px;
  }

  /* Config form */
  .config-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }

  .config-field label {
    display: block;
    font-size: 11px;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 4px;
  }

  .config-field input {
    width: 100%;
    padding: 8px 10px;
    font-family: inherit;
    font-size: 13px;
    background: var(--bg);
    border: 1px solid var(--border);
    border-radius: 4px;
    color: var(--text);
  }
  .config-field input:focus {
    outline: none;
    border-color: var(--accent);
  }

  /* Lightbox */
  .lightbox {
    display: none;
    position: fixed;
    inset: 0;
    background: #000000dd;
    z-index: 100;
    align-items: center;
    justify-content: center;
  }
  .lightbox.active { display: flex; }
  .lightbox img {
    max-width: 90vw;
    max-height: 90vh;
    border-radius: 8px;
  }
  .lightbox-close {
    position: absolute;
    top: 20px; right: 20px;
    background: none; border: none;
    color: #fff; font-size: 28px;
    cursor: pointer;
  }

  @media (max-width: 768px) {
    .container { grid-template-columns: 1fr; }
  }
</style>
</head>
<body>

<header>
  <h1><span>PURPLE</span> RHEA</h1>
  <div>
    <span id="connection-dot"></span>
    <span id="connection-text" style="font-size:12px; color:var(--muted)">connecting...</span>
  </div>
</header>

<div class="container">

  <!-- Status -->
  <div class="card">
    <h2>Status</h2>
    <span id="status-badge" class="badge-idle">idle</span>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    <div id="frame-count" style="font-size: 14px; margin-bottom: 6px;">0 / <span id="total-frames">0</span> frames</div>
    <div id="stage-text"></div>
  </div>

  <!-- Controls -->
  <div class="card">
    <h2>Controls</h2>
    <div class="btn-row" style="margin-bottom: 12px;">
      <button class="primary" id="btn-scan-serial" onclick="startScan('serial')">Scan (Serial)</button>
      <button id="btn-scan-disk" onclick="startScan('disk')">Scan (Disk)</button>
    </div>
    <div class="btn-row">
      <button id="btn-download" onclick="downloadResult()" disabled>Download .obj</button>
      <button id="btn-view3d" onclick="load3DView()" disabled>View 3D</button>
      <button onclick="loadFrames()">Refresh Frames</button>
    </div>
  </div>

  <!-- Log -->
  <div class="card full-width">
    <h2>Log</h2>
    <div id="log"></div>
  </div>

  <!-- Frames -->
  <div class="card full-width">
    <h2>Captured Frames</h2>
    <div class="frame-grid" id="frame-grid"></div>
  </div>

  <!-- 3D Viewer -->
  <div class="card full-width">
    <h2>3D Result</h2>
    <div id="viewer-container">
      <div class="viewer-placeholder" id="viewer-placeholder">Run a scan to see the 3D point cloud</div>
    </div>
  </div>

  <!-- Config -->
  <div class="card full-width">
    <h2>Configuration</h2>
    <div class="config-grid" id="config-grid"></div>
    <button style="margin-top: 12px;" onclick="saveConfig()">Save Config</button>
  </div>

</div>

<!-- Lightbox -->
<div class="lightbox" id="lightbox" onclick="closeLightbox()">
  <button class="lightbox-close">&times;</button>
  <img id="lightbox-img" src="">
</div>

<script>
// ── SSE connection ──────────────────────────────────────────────────────────

let evtSource = null;

function connectSSE() {
  if (evtSource) evtSource.close();
  evtSource = new EventSource('/api/events');

  evtSource.onopen = () => {
    document.getElementById('connection-dot').classList.add('connected');
    document.getElementById('connection-text').textContent = 'connected';
  };

  evtSource.onerror = () => {
    document.getElementById('connection-dot').classList.remove('connected');
    document.getElementById('connection-text').textContent = 'disconnected';
    setTimeout(connectSSE, 3000);
  };

  evtSource.onmessage = (e) => {
    const d = JSON.parse(e.data);
    updateStatus(d);
  };
}

// ── Status updates ──────────────────────────────────────────────────────────

function updateStatus(d) {
  const badge = document.getElementById('status-badge');
  badge.textContent = d.state;
  badge.className = 'badge-' + d.state;

  const total = d.total_frames || 1;
  document.getElementById('total-frames').textContent = d.total_frames;

  let pct = 0;
  if (d.state === 'scanning') {
    pct = (d.frames_captured / total) * 50;
    document.getElementById('frame-count').textContent =
      d.frames_captured + ' / ' + d.total_frames + ' frames';
  } else if (d.state === 'processing') {
    pct = 50 + parsePipelineProgress(d.pipeline_stage) * 50;
  } else if (d.state === 'done') {
    pct = 100;
  }
  document.getElementById('progress-fill').style.width = pct + '%';
  document.getElementById('stage-text').textContent = d.pipeline_stage || '';

  const busy = d.state === 'scanning' || d.state === 'processing';
  document.getElementById('btn-scan-serial').disabled = busy;
  document.getElementById('btn-scan-disk').disabled = busy;
  document.getElementById('btn-download').disabled = d.state !== 'done';
  document.getElementById('btn-view3d').disabled = d.state !== 'done';

  if (d.type && d.type !== 'keepalive') {
    addLog(d.type + (d.error ? ': ' + d.error : ''));
  }

  if (d.state === 'done') {
    loadFrames();
  }
}

function parsePipelineProgress(stage) {
  if (!stage) return 0;
  const m = stage.match(/\[(\d+)\/(\d+)\]/);
  if (m) return parseInt(m[1]) / parseInt(m[2]);
  return 0;
}

// ── Actions ─────────────────────────────────────────────────────────────────

function startScan(source) {
  addLog('Starting scan (' + source + ')...');
  fetch('/api/scan/start', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({source})
  }).then(r => r.json()).then(d => {
    if (d.error) addLog('Error: ' + d.error);
  });
}

function downloadResult() {
  window.location.href = '/api/result/download';
}

function loadFrames() {
  fetch('/api/frames').then(r => r.json()).then(files => {
    const grid = document.getElementById('frame-grid');
    grid.innerHTML = '';
    files.forEach(f => {
      const img = document.createElement('img');
      img.src = '/api/frames/' + f;
      img.alt = f;
      img.title = f;
      img.onclick = () => openLightbox('/api/frames/' + f);
      grid.appendChild(img);
    });
  });
}

function openLightbox(src) {
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.add('active');
}

function closeLightbox() {
  document.getElementById('lightbox').classList.remove('active');
}

// ── 3D viewer (vanilla WebGL point cloud) ───────────────────────────────────

let gl = null;
let viewerState = { rotX: -0.4, rotY: 0, dist: 1.5, dragging: false, lastX: 0, lastY: 0 };

function load3DView() {
  addLog('Loading point cloud...');
  fetch('/api/result/points').then(r => r.json()).then(points => {
    if (points.error) { addLog(points.error); return; }
    document.getElementById('viewer-placeholder').style.display = 'none';
    init3D(points);
    addLog('Loaded ' + points.length + ' points');
  });
}

function init3D(points) {
  const container = document.getElementById('viewer-container');
  let canvas = container.querySelector('canvas');
  if (!canvas) {
    canvas = document.createElement('canvas');
    container.appendChild(canvas);
  }
  canvas.width = container.clientWidth;
  canvas.height = container.clientHeight;

  gl = canvas.getContext('webgl');
  if (!gl) { addLog('WebGL not supported'); return; }

  // center and scale points
  let cx = 0, cy = 0, cz = 0;
  for (const p of points) { cx += p[0]; cy += p[1]; cz += p[2]; }
  cx /= points.length; cy /= points.length; cz /= points.length;
  let maxR = 0;
  for (const p of points) {
    const r = Math.sqrt((p[0]-cx)**2 + (p[1]-cy)**2 + (p[2]-cz)**2);
    if (r > maxR) maxR = r;
  }
  const scale = 1.0 / (maxR || 1);

  const verts = new Float32Array(points.length * 3);
  for (let i = 0; i < points.length; i++) {
    verts[i*3]   = (points[i][0] - cx) * scale;
    verts[i*3+1] = (points[i][1] - cy) * scale;
    verts[i*3+2] = (points[i][2] - cz) * scale;
  }

  const vsrc = `
    attribute vec3 aPos;
    uniform mat4 uMVP;
    varying float vDepth;
    void main() {
      gl_Position = uMVP * vec4(aPos, 1.0);
      gl_PointSize = 2.0;
      vDepth = gl_Position.z / gl_Position.w;
    }`;
  const fsrc = `
    precision mediump float;
    varying float vDepth;
    void main() {
      float d = clamp(0.5 - vDepth * 0.5, 0.2, 1.0);
      gl_FragColor = vec4(0.486*d, 0.36*d, 0.988*d, 1.0);
    }`;

  const vs = gl.createShader(gl.VERTEX_SHADER);
  gl.shaderSource(vs, vsrc); gl.compileShader(vs);
  const fs = gl.createShader(gl.FRAGMENT_SHADER);
  gl.shaderSource(fs, fsrc); gl.compileShader(fs);

  const prog = gl.createProgram();
  gl.attachShader(prog, vs); gl.attachShader(prog, fs); gl.linkProgram(prog);
  gl.useProgram(prog);

  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, verts, gl.STATIC_DRAW);

  const aPos = gl.getAttribLocation(prog, 'aPos');
  gl.enableVertexAttribArray(aPos);
  gl.vertexAttribPointer(aPos, 3, gl.FLOAT, false, 0, 0);

  const uMVP = gl.getUniformLocation(prog, 'uMVP');
  gl.enable(gl.DEPTH_TEST);
  gl.clearColor(0.04, 0.043, 0.063, 1);

  const numPts = points.length;

  // mouse controls
  canvas.onmousedown = (e) => { viewerState.dragging = true; viewerState.lastX = e.clientX; viewerState.lastY = e.clientY; };
  canvas.onmouseup = () => { viewerState.dragging = false; };
  canvas.onmousemove = (e) => {
    if (!viewerState.dragging) return;
    viewerState.rotY += (e.clientX - viewerState.lastX) * 0.01;
    viewerState.rotX += (e.clientY - viewerState.lastY) * 0.01;
    viewerState.lastX = e.clientX;
    viewerState.lastY = e.clientY;
  };
  canvas.onwheel = (e) => { viewerState.dist *= e.deltaY > 0 ? 1.1 : 0.9; e.preventDefault(); };

  function render() {
    const w = canvas.width, h = canvas.height;
    gl.viewport(0, 0, w, h);
    gl.clear(gl.COLOR_BUFFER_BIT | gl.DEPTH_BUFFER_BIT);

    const mvp = mat4_perspective(45, w/h, 0.01, 100);
    mat4_translate(mvp, 0, 0, -viewerState.dist);
    mat4_rotateX(mvp, viewerState.rotX);
    mat4_rotateY(mvp, viewerState.rotY);

    gl.uniformMatrix4fv(uMVP, false, mvp);
    gl.drawArrays(gl.POINTS, 0, numPts);
    requestAnimationFrame(render);
  }
  render();
}

// minimal matrix helpers
function mat4_perspective(fovDeg, aspect, near, far) {
  const f = 1 / Math.tan(fovDeg * Math.PI / 360);
  const nf = 1 / (near - far);
  return new Float32Array([
    f/aspect, 0, 0, 0,
    0, f, 0, 0,
    0, 0, (far+near)*nf, -1,
    0, 0, 2*far*near*nf, 0
  ]);
}
function mat4_translate(m, x, y, z) {
  m[12] += m[0]*x + m[4]*y + m[8]*z;
  m[13] += m[1]*x + m[5]*y + m[9]*z;
  m[14] += m[2]*x + m[6]*y + m[10]*z;
  m[15] += m[3]*x + m[7]*y + m[11]*z;
}
function mat4_rotateX(m, a) {
  const s = Math.sin(a), c = Math.cos(a);
  const r = new Float32Array(16); r.set(m);
  m[4]=r[4]*c+r[8]*s;  m[5]=r[5]*c+r[9]*s;  m[6]=r[6]*c+r[10]*s;  m[7]=r[7]*c+r[11]*s;
  m[8]=r[8]*c-r[4]*s;  m[9]=r[9]*c-r[5]*s;  m[10]=r[10]*c-r[6]*s; m[11]=r[11]*c-r[7]*s;
}
function mat4_rotateY(m, a) {
  const s = Math.sin(a), c = Math.cos(a);
  const r = new Float32Array(16); r.set(m);
  m[0]=r[0]*c-r[8]*s;  m[1]=r[1]*c-r[9]*s;  m[2]=r[2]*c-r[10]*s; m[3]=r[3]*c-r[11]*s;
  m[8]=r[0]*s+r[8]*c;  m[9]=r[1]*s+r[9]*c;  m[10]=r[2]*s+r[10]*c; m[11]=r[3]*s+r[11]*c;
}

// ── Log ─────────────────────────────────────────────────────────────────────

function addLog(msg) {
  const log = document.getElementById('log');
  const ts = new Date().toLocaleTimeString();
  const entry = document.createElement('div');
  entry.className = 'log-entry';
  entry.textContent = ts + '  ' + msg;
  log.appendChild(entry);
  log.scrollTop = log.scrollHeight;
}

// ── Config ──────────────────────────────────────────────────────────────────

function loadConfig() {
  fetch('/api/config').then(r => r.json()).then(cfg => {
    const grid = document.getElementById('config-grid');
    grid.innerHTML = '';
    for (const [key, val] of Object.entries(cfg)) {
      const div = document.createElement('div');
      div.className = 'config-field';
      div.innerHTML = '<label>' + key.replace(/_/g, ' ') + '</label>'
        + '<input data-key="' + key + '" value="' + val + '">';
      grid.appendChild(div);
    }
  });
}

function saveConfig() {
  const inputs = document.querySelectorAll('#config-grid input');
  const body = {};
  inputs.forEach(inp => {
    let v = inp.value;
    if (v === 'true') v = true;
    else if (v === 'false') v = false;
    else if (!isNaN(v) && v !== '') v = Number(v);
    body[inp.dataset.key] = v;
  });
  fetch('/api/config', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body),
  }).then(r => r.json()).then(d => {
    addLog('Config updated: ' + Object.keys(d.updated).join(', '));
  });
}

// ── Init ────────────────────────────────────────────────────────────────────

connectSSE();
loadFrames();
loadConfig();

document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') closeLightbox();
});
</script>
</body>
</html>
