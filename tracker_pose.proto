syntax = "proto3";

message TrackerPose {
  float  yaw          = 1;  // degrees, zeroed on first ZUPT
  float  pitch        = 2;  // degrees, positive = nose down
  float  roll         = 3;  // degrees
  uint32 frame_index  = 4;
  float  radius       = 5;  // metres, from radius_estimate()
  bool   radius_valid = 6;  // false until estimator converges
}