CONFIG_STDOUT_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_GPIO=y
# nanopb needs these
CONFIG_NANOPB=y
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="TrackerPose"
CONFIG_BT_MAX_CONN=1
# UART for TX to ESP32-CAM
CONFIG_UART_INTERRUPT_DRIVEN=n
CONFIG_SERIAL=y
# Sensor stack — LSM6DS3TR-C IMU is wired in the XIAO BLE Sense board DTS
# with compatible "st,lsm6dsl"; the lsm6dsl driver handles it.
CONFIG_I2C=y
CONFIG_SENSOR=y
CONFIG_LSM6DSL=y

CONFIG_CBPRINTF_FP_SUPPORT=y
CONFIG_FPU=y

# USB CDC-ACM console is wired by the XIAO BLE board defconfig
# (USB_DEVICE_STACK_NEXT=y + CDC_ACM_SERIAL_INITIALIZE_AT_BOOT=y). Do NOT also
# enable CONFIG_USB_DEVICE_STACK — that links the legacy cdc_acm driver and
# collides with the new-stack one on the same DT node.

CONFIG_LOG=y
CONFIG_LOG_DEFAULT_LEVEL=2
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="TrackerPose"
